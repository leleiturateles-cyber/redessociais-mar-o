<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociais - Março</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 600;
            font-size: 1.1em;
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .social-link .icon {
            margin-right: 10px;
            font-size: 1.5em;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redes Sociais</h1>
        <p class="subtitle">Conecte-se conosco em março 🚀</p>
        
        <div class="social-links">
            <a href="#" class="social-link">
                <span class="icon">f</span>
                Facebook
            </a>
            <a href="#" class="social-link">
                <span class="icon">𝕏</span>
                Twitter / X
            </a>
            <a href="#" class="social-link">
                <span class="icon">📷</span>
                Instagram
            </a>
            <a href="#" class="social-link">
                <span class="icon">▶</span>
                YouTube
            </a>
            <a href="#" class="social-link">
                <span class="icon">in</span>
                LinkedIn
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2026 Redes Sociais - Março. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
